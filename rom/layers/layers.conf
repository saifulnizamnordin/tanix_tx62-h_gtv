# Build variants: name = layer, layer, ...
# Layers apply in order. "upstream:<name>" is a layer from lucagoc/H96Max-H313-lineageos
# (pinned in fetch.sh); everything else lives in rom/layers/.

# First test build: network ADB without the RSA prompt, ADB over the USB OTG port.
vanilla_debug = tx6s, tx6s-ir, tx6s-debug
vanilla       = tx6s, tx6s-ir
gms_core      = tx6s, tx6s-ir, upstream:overlay-gms-core
gms_full      = tx6s, tx6s-ir, upstream:overlay-gms-core, upstream:overlay-gms-full, tx6s-gms-full
